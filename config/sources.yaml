sources:
  - name: "abuse.ch - URLhaus"
    class: "collectors.urlhaus.URLhausCollector"
    interval_minutes: 60
    enabled: true

  - name: "abuse.ch - Feodo"
    class: "collectors.feodo.FeodoCollector"
    interval_minutes: 60
    enabled: true

  - name: "abuse.ch - ThreatFox"
    class: "collectors.threatfox.ThreatFoxCollector"
    interval_minutes: 60
    enabled: true

  - name: "Spamhaus - DROP"
    class: "collectors.spamhaus.SpamhausDropCollector"
    interval_minutes: 1440
    enabled: true

  - name: "AlienVault OTX"
    class: "collectors.otx.OTXCollector"
    interval_minutes: 60
    enabled: true

  - name: "OpenPhish"
    class: "collectors.openphish.OpenPhishCollector"
    interval_minutes: 720
    enabled: true

  - name: "CISA KEV"
    class: "collectors.cisa_kev.CisaKevCollector"
    interval_minutes: 1440
    enabled: true
  - name: "Tor Project - Exit List"
    class: "collectors.tor_exit.TorExitCollector"
    interval_minutes: 360
    enabled: true
  - name: "NVD"
    class: "collectors.nvd.NvdCollector"
    interval_minutes: 1440
    enabled: true