sources:
  - name: "abuse.ch - URLhaus"
    class: "collectors.urlhaus.URLhausCollector"
    interval_minutes: 60
    enabled: true

  - name: "abuse.ch - Feodo"
    class: "collectors.feodo.FeodoCollector"
    interval_minutes: 60
    enabled: true

  - name: "abuse.ch - ThreatFox"
    class: "collectors.threatfox.ThreatFoxCollector"
    interval_minutes: 60
    enabled: true

  - name: "Spamhaus - DROP"
    class: "collectors.spamhaus.SpamhausDropCollector"
    interval_minutes: 1440
    enabled: true