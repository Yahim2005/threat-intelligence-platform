# Registre des sources de threat intelligence du TIP.
# interval_minutes : fréquence de collecte souhaitée (utilisée par le scheduler au J9)
# enabled          : mettre à false pour désactiver sans supprimer la config

sources:
  - name: "abuse.ch - URLhaus"
    class: "collectors.urlhaus.URLhausCollector"
    interval_minutes: 60
    enabled: true