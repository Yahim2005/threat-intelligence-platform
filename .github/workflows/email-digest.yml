name: Email Digest

on:
  schedule:
    - cron: '0 6 * * *'  # tous les jours 6h UTC -- le script decide lui-meme
                          # s'il s'est ecoule >= 3 jours depuis le dernier envoi
                          # reussi (voir core/email_digest.py, should_send_now),
                          # un cron */3 sur le jour du mois ne garantirait pas
                          # un espacement reel de 3 jours
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send email digest
        run: python -m scripts.send_email_digest
