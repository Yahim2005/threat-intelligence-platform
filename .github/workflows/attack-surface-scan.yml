name: Attack Surface Scan

on:
  schedule:
    - cron: '0 */6 * * *'  # toutes les 6h le temps de la première passe complète
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # legerement au-dessus des 5h30 de budget interne du script
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run attack surface scan
        run: python -m scripts.scan_attack_surface
