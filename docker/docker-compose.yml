services:
  db:
    image: postgres:16-alpine
    container_name: tip_postgres
    environment:
      POSTGRES_USER: tip
      POSTGRES_PASSWORD: tip_secret
      POSTGRES_DB: tip_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tip -d tip_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: