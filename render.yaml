services:
  # ── Backend FastAPI ──────────────────────────────────────────────
  - type: web
    name: tip-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: gunicorn api.main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tip-db
          property: connectionString
      - key: TIP_API_KEY
        generateValue: true
      - key: ABUSECH_AUTH_KEY
        sync: false
      - key: OTX_API_KEY
        sync: false
      - key: NVD_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

  # ── Frontend React ───────────────────────────────────────────────
  - type: web
    name: tip-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

# ── Base de données PostgreSQL ───────────────────────────────────
databases:
  - name: tip-db
    databaseName: tip_db
    user: tip
